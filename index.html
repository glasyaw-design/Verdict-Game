<style>
/* 레이아웃: 위 도트 법정과 대사창, 아래 재판장 책상(왼쪽 기록철, 오른쪽 판단 절차). 법정의 녹색 벽·호두나무·황동 저울에서 뽑은 단일 다크 테마 */
:root{
  --bg:#11191a; --panel:#182224; --panel-2:#1e2a2d; --line:#2d3c3f;
  --fg:#e7e2d4; --muted:#96a39f; --brass:#c9a24b; --brass-dim:#8a6f33;
  --paper:#ebe5d4; --paper-2:#ddd5c0; --ink:#222a33; --seal:#b8372d;
  --ok:#62ad6f; --warn:#d99b3a; --bad:#d0574b; --info:#8cc8e0; --hot:#e8a083;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-doc:"Gowun Batang","AppleMyungjo","Batang",serif;
  --f-ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-data:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-family:var(--f-ui);font-size:15.5px;line-height:1.7;letter-spacing:-.005em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.clue:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1120px;margin:0 auto;display:grid;gap:12px}

.top{position:relative;z-index:48;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
@media (max-width:900px){.top{grid-template-columns:minmax(0,1fr)}.hud{order:3}.ctrl{order:2}}
.app{container-type:inline-size}
@container (max-width:1180px){.top{grid-template-columns:auto minmax(0,1fr)}.top .ctrl{justify-self:end}.top .hud{order:3;grid-column:1/-1}}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--brass);line-height:1}
.brand small{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.hud{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;align-items:center;min-width:0}
.hud>span{background:var(--panel);border:1px solid var(--line);padding:4px 10px;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.hud>span.rk{border-color:var(--brass-dim)}
.hud .rk{font-family:var(--f-display);font-size:17px;color:var(--fg)}
.hud .k{color:var(--muted);font-size:12px;margin-right:4px;white-space:nowrap}
.hud>span.rep{white-space:nowrap}
.hud .v{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.rep{display:inline-flex;align-items:center;gap:6px}
.rep i{display:block;width:84px;height:8px;background:var(--line);position:relative}
.rep i b{position:absolute;inset:0 auto 0 0;background:var(--brass)}
.ctrl{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ctrl .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ic{background:var(--panel);border:1px solid var(--line);padding:6px 12px;font-size:13.5px;color:var(--fg);min-height:34px}
.ic:hover{border-color:var(--brass-dim)}
.ic[aria-pressed="false"]{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.ic[aria-pressed="true"]{color:var(--brass);border-color:var(--brass-dim)}
.caseline{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
#caseline>span{background:var(--panel);border:1px solid var(--line);padding:3px 10px}
#caseline:empty{display:none}
.caseline b{color:var(--fg)}

.stage{display:grid;justify-items:center}
.screen{position:relative;width:100%;max-width:min(100%,calc(46vh / var(--z,1) * 16 / 9));aspect-ratio:16/9;border:3px solid #3b2a1d;border-bottom:none;background:#0c1213}
.screen canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;background:linear-gradient(180deg,rgba(10,14,15,.55),rgba(10,14,15,.9));overflow:auto}
.overlay h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,58px);color:var(--brass);margin:0;line-height:1.1;text-shadow:0 2px 0 #3b2a1d}
.overlay p{margin:.4em auto 0;max-width:48ch;font-size:14px}
.overlay .kicker{font-family:var(--f-data);font-size:12px;letter-spacing:.2em;color:var(--muted)}
.overlay .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;align-items:center}
.overlay label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.setup{text-align:left;display:grid;gap:10px}
.setup fieldset{border:0;margin:0;padding:0;min-width:0}
.setup legend{font-size:13px;color:var(--muted);margin-bottom:4px;padding:0}
.sopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sopts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.setup label.sopt{display:block;cursor:pointer;color:var(--fg);font-size:inherit;position:relative}
.tmain{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tmain .btn{min-width:10.5em;padding:10px 16px;font-size:15px}.tmain .btn small{color:var(--muted);font-size:12px;margin-left:4px}
.tmodes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:660px;margin:12px auto 0}
.mtile{display:flex;flex-direction:column;gap:3px;text-align:left;background:#0e1415d9;border:1px solid var(--line);border-top:3px solid var(--mt,var(--brass));padding:9px 11px 10px;min-height:62px;line-height:1.35;color:var(--fg)}
.mtile b{font-size:14.5px;color:var(--mt,var(--brass));font-weight:600}.mtile small{font-size:11.5px;color:var(--muted);word-break:keep-all}
.mtile:hover,.mtile:focus-visible{background:#1a2427;border-color:var(--mt,var(--brass))}
.tlinks{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.lnk{background:none;border:0;padding:4px 2px;color:var(--muted);font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#ffffff33}
.lnk:hover{color:var(--fg)}
@media (max-width:620px){.tmodes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card.story{max-width:600px;border-color:#3b2a1d;box-shadow:inset 0 3px 0 var(--sc)}
.card.story .ch h3{color:var(--sc)}
.stb{min-height:150px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.stw{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}.stw b{color:var(--sc);font-size:16px}.stw small{color:var(--muted);font-size:12px}
.stl{font-size:16.5px;line-height:1.75;margin:0}.stn{font-style:italic;color:var(--muted);text-align:center}
.stp{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.stlist{display:grid;gap:10px}
.isslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.iss{position:relative;border:1px solid var(--line);background:var(--panel-2);padding:6px 8px 8px;overflow:hidden}.iss b{display:block;font-size:13px}.iss small{color:var(--muted);font-size:11.5px}
.iss i{position:absolute;left:0;bottom:0;height:3px;background:var(--brass);opacity:.7}.iss.got{border-color:var(--brass)}.iss.got b{color:var(--brass)}
.sharebox{width:100%;min-height:96px;margin-top:10px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);font:13px/1.5 var(--f-data);padding:8px}
.kr{border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px}
.att{display:inline-block;font-size:11.5px;padding:0 6px;margin:2px 6px 2px 0;border:1px solid}.att-y{color:#9fdaa9;border-color:#62ad6f66}.att-n{color:#f1a69d;border-color:#d0574b66}.att-m{color:var(--warn);border-color:#d99b3a66}
.paper .att-y{color:#2f6b3a;border-color:#2f6b3a66}.paper .att-n{color:#9a3328;border-color:#9a332866}.paper .att-m{color:#8a5a12;border-color:#8a5a1266}
.tk{margin:0 0 6px;font-size:14px;line-height:1.6}.tksto{border-left:3px solid #b8a27a;padding-left:10px;margin:0 0 12px;opacity:.92}.tkh{font-size:12px;letter-spacing:.06em;color:#7a6a4e;margin:0 0 6px;font-weight:700}.tk b{color:#5b3a1d;margin-right:4px}
.tkchip{border-color:var(--brass)!important}.tkchip .no{color:var(--brass)}
.dkc.seen{opacity:.82}.seenb{display:inline-block;font-style:normal;font-size:11.5px;color:var(--info);border:1px solid #8cc8e055;padding:0 6px;margin-bottom:3px}
.mildset{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:8px 10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:left}
.mildset input{margin-top:3px}.mildset b{display:block;font-size:14px}.mildset small{display:block;color:var(--muted);font-size:12px}
.hlp{border:1px solid var(--line);margin-bottom:8px;background:var(--panel-2)}.hlp summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--brass)}.hlp>div{padding:0 14px 10px;font-size:14px;line-height:1.65}.hlp ol,.hlp ul{padding-left:1.2em;margin:4px 0}.hlp li{margin-bottom:4px}
.stcard.locked{opacity:.55;border-left-style:dashed}.stcard.locked p{color:var(--muted)}
.stunlock{margin:10px 0 0;padding:8px 10px;border:1px solid var(--brass);color:var(--brass);background:#c9a24b14;font-size:14px}
.stwarnrule b{color:var(--bad)}
.stcard{border:1px solid var(--line);border-left:4px solid var(--sc);padding:10px 12px;background:var(--panel-2);display:flow-root}
.stthumb{float:left;width:96px;height:96px;object-fit:cover;image-rendering:pixelated;margin:0 12px 4px 0;border:1px solid #3b2a1d;background:#0c1213}
.stcard.locked .stthumb{filter:grayscale(1) brightness(.45)}
@media (max-width:560px){.stthumb{width:72px;height:72px;margin-right:10px}}
.stban{display:block;width:100%;aspect-ratio:16/6;object-fit:cover;image-rendering:pixelated;border-bottom:1px solid #3b2a1d}.stban.big{aspect-ratio:16/9}
@media (max-height:700px){.stban.big{aspect-ratio:16/7}.stban{aspect-ratio:16/5}}
.overlay.endart{background:linear-gradient(180deg,rgba(10,14,15,.15) 0%,rgba(10,14,15,.55) 45%,rgba(10,14,15,.92) 100%),var(--ea) 50% var(--ey,50%)/cover no-repeat;image-rendering:pixelated}
.overlay.endart h2{text-shadow:0 2px 0 #3b2a1d,0 0 18px rgba(0,0,0,.8)}.overlay.endart p,.overlay.endart .kicker{text-shadow:0 1px 3px rgba(0,0,0,.9)}
.sth{display:flex;gap:10px;align-items:center}.sth>div{flex:1;min-width:0}.sth b{display:block;font-size:16px;color:var(--sc)}.sth small{color:var(--muted);font-size:12px}
.sth .stn{font-family:var(--f-data);font-style:normal;color:var(--sc);font-size:20px;width:1.2em;text-align:center}
.stlv{font-size:11.5px;border:1px solid var(--sc);color:var(--sc);padding:1px 7px;white-space:nowrap}
.stcard p{margin:6px 0;font-size:13.5px;line-height:1.55}
.stmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stbtn{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.tname{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.tname input{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);padding:7px 10px;width:8.5em;font:inherit;font-size:15px;text-align:center}
.tname input:focus{outline:2px solid var(--brass);outline-offset:1px}
.tname #tnok{min-width:3.5em;font-size:12px;color:var(--good,#7fb07f)}
.overlay .tnhint{font-size:12px;color:var(--muted);margin:0 0 0 2px;max-width:none}
.moveban{position:sticky;top:0;z-index:46;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 12px;background:#2a1f12;border-bottom:2px solid var(--brass);color:var(--fg);font-size:13.5px;text-align:center}
.moveban b{color:var(--brass)}
.mvurl{margin:6px 0 0;text-align:center;font-size:18px}.mvurl a{color:var(--brass);word-break:break-all}
.setname{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px;font-size:13px;color:var(--muted)}
.setname input{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);padding:6px 8px;width:8em;font:inherit}
.sopt input{position:absolute;opacity:0;width:1px;height:1px}
.sopt>span{display:block;height:100%;background:var(--panel);border:1px solid var(--line);padding:7px 9px;line-height:1.4}
.sopt b{display:block;font-size:14.5px}
.sopt small{display:block;font-size:11.5px;color:var(--muted)}
.sopt small.tm{margin-top:3px;color:var(--brass-dim)}
.sopt input:checked+span{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.sopt input:checked+span b{color:var(--brass)}
.sopt input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.setup .hint{margin:2px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:700px){.sopts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.overlay input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:6px 8px;width:7.5em;font:inherit}

.dialog{width:100%;max-width:min(100%,calc(46vh / var(--z,1) * 16 / 9));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:#0e1415;border:3px solid #3b2a1d;padding:10px 12px;min-height:92px}
.dialog canvas{width:56px;height:63px;image-rendering:pixelated;background:#1c2b28;border:2px solid var(--brass-dim)}
.who{font-family:var(--f-display);color:var(--brass);font-size:17px}
.line{font-size:15px;min-height:3em}
.next{background:none;border:1px solid var(--brass-dim);color:var(--brass);padding:6px 10px;font-size:13px;font-family:var(--f-data);white-space:nowrap}

.desk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:stretch}
@media (max-width:820px), (max-width:1100px) and (orientation:portrait), (max-width:1100px) and (max-height:760px){.desk{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.tabs{display:flex;gap:2px}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted);font-size:14px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--brass)}
.pb{padding:16px}
@media (max-width:820px), (max-width:1100px) and (orientation:portrait), (max-width:1100px) and (max-height:760px){.pb{max-height:none}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--panel-2);border:1px solid var(--line);padding:5px 9px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.chip .no{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}

<script>
/* ═════════ 법령 (대한민국 법령 요지, 게임용으로 일부 축약) ═════════ */
const LAW={
 h13:['형법 제13조 (고의)','죄의 성립요소인 사실을 인식하지 못한 행위는 벌하지 아니한다.'],
 h21:['형법 제21조 (정당방위)','① 현재의 부당한 침해로부터 자기 또는 타인의 법익을 방위하기 위하여 한 행위는 상당한 이유가 있는 경우에는 벌하지 아니한다. ② 방위행위가 그 정도를 초과한 경우에는 정황에 따라 그 형을 감경하거나 면제할 수 있다.'],
 h30:['형법 제30조 (공동정범)','2인 이상이 공동하여 죄를 범한 때에는 각자를 그 죄의 정범으로 처벌한다.'],
 h32:['형법 제32조 (종범)','① 타인의 범죄를 방조한 자는 종범으로 처벌한다. ② 종범의 형은 정범의 형보다 감경한다.'],
 h35:['형법 제35조 (누범)','① 금고 이상의 형을 선고받아 그 집행이 종료되거나 면제된 후 3년 내에 금고 이상에 해당하는 죄를 지은 사람은 누범으로 처벌한다. ② 누범의 형은 그 죄에 대하여 정한 형의 장기의 2배까지 가중한다.'],
 h53:['형법 제53조 (정상참작감경)','범죄의 정상에 참작할 만한 사유가 있는 경우에는 그 형을 감경할 수 있다.'],
 h55:['형법 제55조 (법률상 감경의 방법)','유기징역을 감경할 때에는 그 형기의 2분의 1로 한다. 무기징역을 감경할 때에는 10년 이상 50년 이하의 징역으로 한다.'],
 h62:['형법 제62조 (집행유예)','① 3년 이하의 징역이나 금고 또는 500만원 이하의 벌금의 형을 선고할 경우에 정상에 참작할 만한 사유가 있는 때에는 1년 이상 5년 이하의 기간 형의 집행을 유예할 수 있다. 다만, 금고 이상의 형을 선고한 판결이 확정된 때부터 그 집행을 종료하거나 면제된 후 3년까지의 기간에 범한 죄에 대하여 형을 선고하는 경우에는 그러하지 아니하다.'],
 h250:['형법 제250조 (살인)','① 사람을 살해한 자는 사형, 무기 또는 5년 이상의 징역에 처한다.'],
 h257:['형법 제257조 (상해)','① 사람의 신체를 상해한 자는 7년 이하의 징역, 10년 이하의 자격정지 또는 1천만원 이하의 벌금에 처한다.'],
 h259:['형법 제259조 (상해치사)','① 사람의 신체를 상해하여 사망에 이르게 한 자는 3년 이상의 유기징역에 처한다.'],
 h260:['형법 제260조 (폭행)','① 사람의 신체에 대하여 폭행을 가한 자는 2년 이하의 징역, 500만원 이하의 벌금, 구류 또는 과료에 처한다.'],
 h262:['형법 제262조 (폭행치사상)','폭행죄를 범하여 사람을 사망이나 상해에 이르게 한 경우에는 제257조부터 제259조까지의 예에 따른다.'],
 h268:['형법 제268조 (업무상과실·중과실 치사상)','업무상과실 또는 중대한 과실로 사람을 사망이나 상해에 이르게 한 자는 5년 이하의 금고 또는 2천만원 이하의 벌금에 처한다.'],
 h307:['형법 제307조 (명예훼손)','① 공연히 사실을 적시하여 사람의 명예를 훼손한 자는 2년 이하의 징역이나 금고 또는 500만원 이하의 벌금에 처한다. ② 공연히 허위의 사실을 적시하여 사람의 명예를 훼손한 자는 5년 이하의 징역, 10년 이하의 자격정지 또는 1천만원 이하의 벌금에 처한다.'],
 h310:['형법 제310조 (위법성의 조각)','제307조제1항의 행위가 진실한 사실로서 오로지 공공의 이익에 관한 때에는 처벌하지 아니한다.'],
 h319:['형법 제319조 (주거침입)','① 사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입한 자는 3년 이하의 징역 또는 500만원 이하의 벌금에 처한다.'],
 h329:['형법 제329조 (절도)','타인의 재물을 절취한 자는 6년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.'],
 h330:['형법 제330조 (야간주거침입절도)','야간에 사람의 주거, 관리하는 건조물, 선박이나 항공기 또는 점유하는 방실에 침입하여 타인의 재물을 절취한 자는 10년 이하의 징역에 처한다.'],
 h333:['형법 제333조 (강도)','폭행 또는 협박으로 타인의 재물을 강취하거나 기타 재산상의 이익을 취득하거나 제삼자로 하여금 이를 취득하게 한 자는 3년 이상의 유기징역에 처한다.'],
 h335:['형법 제335조 (준강도)','절도가 재물의 탈환에 항거하거나 체포를 면탈하거나 범죄의 흔적을 인멸할 목적으로 폭행 또는 협박한 때에는 제333조 및 제334조의 예에 따른다.'],
 h337:['형법 제337조 (강도상해, 치상)','강도가 사람을 상해하거나 상해에 이르게 한 때에는 무기 또는 7년 이상의 징역에 처한다.'],
 h347:['형법 제347조 (사기)','① 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 10년 이하의 징역 또는 2천만원 이하의 벌금에 처한다.'],
 drug:['마약류 관리에 관한 법률 제58조 (요지)','메트암페타민 등 향정신성의약품을 매매하거나 매매를 알선한 자는 무기 또는 5년 이상의 징역에 처한다.'],
 dangerDrive:['특정범죄가중처벌법 제5조의11 (위험운전 치사상)','① 음주 또는 약물의 영향으로 정상적인 운전이 곤란한 상태에서 자동차를 운전하여 사람을 상해에 이르게 한 사람은 1년 이상 15년 이하의 징역 또는 1천만원 이상 3천만원 이하의 벌금에 처한다.'],
 tcaa:['교통사고처리특례법 제3조 (요지)','차의 운전자가 업무상과실 또는 중대한 과실로 사람을 상해에 이르게 한 경우 5년 이하의 금고 또는 2천만원 이하의 벌금에 처한다. 음주운전 사고 등은 피해자의 처벌불원에도 불구하고 처벌한다.'],
 p217:['형사소송법 제217조 (요지)','체포 현장에서 영장 없이 압수한 물건을 계속 압수할 필요가 있으면 지체 없이, 늦어도 체포한 때부터 48시간 이내에 압수수색영장을 청구하여야 한다.'],
 p308:['형사소송법 제308조의2 (위법수집증거의 배제)','적법한 절차에 따르지 아니하고 수집한 증거는 증거로 할 수 없다.'],
 p309:['형사소송법 제309조 (강제 등 자백의 증거능력)','피고인의 자백이 고문, 폭행, 협박, 신체구속의 부당한 장기화 또는 기망 기타의 방법으로 임의로 진술한 것이 아니라고 의심할 만한 이유가 있는 때에는 이를 유죄의 증거로 하지 못한다.'],

 if(!addNote(d.id+'|'+el.textContent,`${d.no} ${d.id==='ind'?'':d.title}`,el.textContent)){toast('이미 수첩에 있습니다');return}
 el.classList.add('found');sfx('clue');queueSave();toast('수첩에 적었습니다 · '+cs.notes.length+'건');updNoteCount()}
rec.addEventListener('click',e=>{const ch=e.target.closest('[data-doc]');if(ch){sfx('page');S.cs.doc=ch.dataset.doc;renderRec();return}const cl=e.target.closest('.clue');if(cl)clueHit(cl)});
rec.addEventListener('keydown',e=>{const cl=e.target.closest('.clue');if(cl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();clueHit(cl)}});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1400)}
function updNoteCount(){const n=$('#ncount');if(n)n.textContent=S.cs.notes.length+'건 메모'}

/* ═════════ 판단 절차 ═════════ */
const bench=$('#bench');
const STEPS=['신문','증거 채부','유·무죄','양형 인자','선고'];
const evDocs=()=>C().docs.filter(d=>d.adm!==undefined);
const evDone=()=>evDocs().every(d=>S.cs.evid[d.id]);
const roleShort=r=>String(r).replace(/\s*\(.*\)\s*$/,'');
const TO_LABEL=()=>({defendant:`피고인 ${C().def.name}`,witness:`${roleShort(C().wit.role)} ${C().wit.name}`,prosecutor:'검사',defense:'변호인'});
function renderBench(){
 if(S.phase==='trial'&&S.cs&&!S.cs.result)queueSave();
 if(S.phase!=='trial'){bench.innerHTML=`<div class="ph"><h3>판단 절차</h3></div><div class="pb"><p class="empty">재판장석이 비어 있습니다.</p></div>`;return}
 const cs=S.cs;
 if(cs.result){bench.innerHTML=resultHTML();return}
 const nonG=cs.charge&&!guilty(cs.charge);
 const done=[cs.qLeft===0||Object.keys(cs.asked).length>0,evDone(),!!cs.charge,cs.factors.size>0,false];
 let body='';
 if(cs.step===0)body=questionsHTML();
 else if(cs.step===1)body=`<p class="hint">각 증거를 재판의 근거로 쓸 수 있는지(증거능력) 정하세요. 믿을 만한지(증명력)는 별개 문제입니다. 증거마다 상대방의 의견(인부)이 붙어 있습니다. 동의한 전문증거는 쓸 수 있지만, 위법하게 모은 증거는 동의해도 쓸 수 없고, 다툰다고 모두 배제되는 것도 아닙니다.</p>${evDocs().map(d=>`<div class="ev"><div class="t"><b><span class="ty">${d.ty}</span> ${d.no} ${d.title}</b><button data-open="${d.id}">기록 열람</button>${attHTML(C(),d)}${inbuHTML(C(),d)}</div><div class="seg" role="group" aria-label="${d.title}"><button class="in" data-ev="${d.id}" data-v="in" aria-pressed="${cs.evid[d.id]==='in'}">채택</button><button class="out" data-ev="${d.id}" data-v="out" aria-pressed="${cs.evid[d.id]==='out'}">배제</button></div></div>`).join('')}`;
 else if(cs.step===2&&C().counts){const c=C();cs.cnt=cs.cnt||{};body=`<p class="hint">복합 범죄 사건입니다. 공소사실마다 따로 판단하세요. 둘 이상 유죄면 경합범으로 한 번에 형을 정합니다 (형법 제37조, 제38조).</p>${c.counts.map((ct,k)=>`<div class="fgrp"><h4><span class="tag a">공소사실 ${k+1}</span>${ct.title}</h4><div class="opts">${ct.charges.map(ch=>`<label class="opt"><input type="radio" name="cnt_${ct.id}" data-cnt="${ct.id}" value="${ch.id}" ${cs.cnt[ct.id]===ch.id?'checked':''}><span><b>${ch.label}</b><small>${ch.law}</small></span></label>`).join('')}</div></div>`).join('')}${cs.charge?(nonG?`<p class="warn">유죄인 공소사실이 없으면 양형 절차는 생략됩니다.</p>${verdictBtn()}`:''):'<p class="hint">모든 공소사실을 판단해야 다음으로 넘어갈 수 있습니다.</p>'}`}
 else if(cs.step===2)body=`<p class="hint">채택한 증거만으로 판단하세요. 유죄라면 성립하는 죄명을 고릅니다.</p><div class="opts">${C().charges.map(ch=>`<label class="opt"><input type="radio" name="charge" value="${ch.id}" ${cs.charge===ch.id?'checked':''}><span><b>${ch.label}</b><small>${ch.law}</small></span></label>`).join('')}</div>${nonG?`${ngNeed(C(),cs.charge)?`<div class="fgrp ngr"><h4>판결 이유 <small style="color:var(--muted);font-weight:400">왜 처벌하지 않는지 고르세요</small></h4><div class="opts">${NG_REASONS[cs.charge].map(([k,l,d])=>`<label class="opt"><input type="radio" name="ngreason" value="${k}" ${cs.reason===k?'checked':''}><span><b>${l}</b><small>${d}</small></span></label>`).join('')}</div></div>`:''}<p class="warn">유죄가 아니면 양형 절차는 생략됩니다.</p>${verdictBtn()}`:''}`;
 else if(cs.step===3)body=`<p class="hint">기록과 신문으로 확인되는 사정만 고르세요. 해당하지 않는 인자를 고르면 감점됩니다.</p>${FGROUPS.map(([t,n,cl])=>`<div class="fgrp"><h4><span class="tag ${cl}">${cl==='m'?'감경':'가중'}</span>${n}</h4>${FACTORS.filter(f=>f.t===t).map(f=>`<label class="fl"><input type="checkbox" data-f="${f.id}" ${cs.factors.has(f.id)?'checked':''}><span>${f.n}${f.d?` <small>${f.d}</small>`:''}</span></label>`).join('')}</div>`).join('')}`;
 else body=keyReasonHTML()+sentenceHTML();
 bench.innerHTML=`<div class="ph"><h3>판단 절차</h3><span class="caseline" id="ncount">${cs.notes.length}건 메모</span></div>
 <div class="steps">${STEPS.map((s,i)=>`<button class="step ${done[i]?'done':''}" data-step="${i}" ${i===cs.step?'aria-current="step"':''} ${(i>=3&&nonG)?'disabled':''}><b>${done[i]?'✓':i+1}</b>${s}</button>`).join('')}</div>
 <div class="pb" id="bbody">${body}</div>
 <div class="nav"><button class="btn" data-go="-1" ${cs.step===0?'disabled':''}>◀ 이전</button>${cs.step<4&&!(cs.step===2&&nonG)?`<button class="btn primary" data-go="1">다음: ${STEPS[cs.step+1]} ▶</button>`:''}</div>`;
}
function questionsHTML(){
 const cs=S.cs,c=C(),L=TO_LABEL();
 if(cs.pending){const q=c.qs.find(x=>x.id===cs.pending);
  return `<div class="ruling"><p><b>${q.obj.by==='defense'?'변호인':'검사'}의 이의:</b> ${q.obj.text}</p><p style="color:var(--muted);font-size:13px">질문: "${q.q}"</p><div class="row"><button class="btn primary" data-rule="sustain">이의 인용 (질문 철회)</button><button class="btn" data-rule="overrule">이의 기각 (답변하게 함)</button></div></div>`}
 const mark=dget().mark||cs.insight;
 const groups=[['defendant'],['witness'],['prosecutor'],['defense'],['conf','증거 제시 (진술과 증거를 맞대기)'],['cross','소송관계인 신문 허가 (이의가 나올 수 있음)']];
 const inG=(q,g)=>g==='cross'?q.cross:g==='conf'?!!q.conf:(!q.cross&&!q.conf&&q.to===g);
 const locked=c.qs.filter(q=>!qOpen(q)).length;
 const pips=Array.from({length:cs.qMax},(_,i)=>`<span style="display:inline-block;width:10px;height:10px;margin-right:3px;border:1px solid var(--brass);background:${i<cs.qLeft?'var(--brass)':'transparent'}"></span>`).join('');
 const btn=q=>{const st=cs.asked[q.id],r=cs.rulings[q.id];
  let sub='';if(st==='done'){sub=q.cross?(r?(r.choice==='sustain'?'<small>이의 인용 · 질문 철회</small>':`<small>이의 기각 · ${q.a}</small>`):''):`<small>${q.a}</small>`}else if(st==='wait')sub='<small>답변 듣는 중…</small>';
  const tag=(q.req?'<span class="x">추가 신문 </span>':'')+(q.cross?'<span class="x">이의 가능 </span>':'')+(mark&&q.key&&!st?'<span class="x" style="color:var(--brass)">★ 핵심 </span>':'');
  const label=q.cross?q.label:q.conf?`${c.docs.find(d=>d.id===q.conf).no} ${c.docs.find(d=>d.id===q.conf).title} → ${L[q.to]}`:q.q;
  return `<button class="q ${st?'done':''}" data-q="${q.id}" ${st||cs.qLeft<=0?'disabled':''}>${tag}${label}${sub}</button>`};
 return `<p class="hint" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span>남은 신문</span><span>${pips}</span><span class="left">${cs.qLeft}/${cs.qMax}</span></p>
 <p class="hint">사건 난도와 게임 난이도에 따라 신문 횟수가 다릅니다. 어떤 답변은 추가 신문을 열고, 증거를 들이대면 진술이 바뀌기도 합니다. 이의가 인용되어 철회된 신문은 횟수에서 빼지 않습니다.${busy?' <b style="color:var(--warn)">대사가 진행 중입니다. 다른 신문을 누르면 남은 대사를 건너뛰고 바로 묻습니다.</b>':''}</p>
 ${groups.map(([g,label])=>{const qs=c.qs.filter(q=>inG(q,g)&&qOpen(q));if(!qs.length)return '';return `<div class="qgrp"><h4>${label||'→ '+L[g]}</h4>${qs.map(btn).join('')}</div>`}).join('')}
 ${locked?`<p class="hint">아직 열리지 않은 추가 신문 ${locked}개</p>`:''}`;
}
function verdictBtn(){const cs=S.cs;const needR=cs.charge&&!guilty(cs.charge)&&ngNeed(C(),cs.charge)&&!cs.reason;const ok=evDone()&&cs.charge&&!needR;
 if(cs.confirm)return `<div class="confirm"><span>이대로 선고합니까? 되돌릴 수 없습니다.</span><button class="btn" data-cancel>다시 검토</button><button class="btn danger" data-pronounce>선고</button></div>`;
 return `${!evDone()?'<p class="warn">2단계에서 모든 증거의 채부를 정해야 선고할 수 있습니다.</p>':''}${needR?'<p class="warn">판결 이유를 골라야 선고할 수 있습니다.</p>':''}<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" data-ask ${ok?'':'disabled'}>판결 선고</button></div>`}
function gk(){const ch=C().charges.find(x=>x.id===S.cs.charge);return ch&&ch.guide}
function keyReasonHTML(){const cs=S.cs,c=C();if(c.counts||!cs.charge||!guilty(cs.charge))return '';const k=keyReasonOpts(c);if(!k)return '';
 return `<div class="fgrp kr"><h4>판결문 핵심 이유 <small style="color:var(--muted);font-weight:400">선택 · 가장 무겁게 본 사정 하나</small></h4><div class="opts">${k.opts.map(f=>`<label class="opt"><input type="radio" name="keyr" value="${f}" ${cs.keyr===f?'checked':''}><span><b>${KR_TEXT(f)}</b></span></label>`).join('')}</div></div>`}
function sentenceHTML(){const cs=S.cs,k=gk();
 if(!k)return '<p class="empty">3단계에서 유죄 죄명을 먼저 고르세요.</p>';
 const fm=GUIDE[k].fineMax;if(!fm&&cs.type==='fine')cs.type='prison';
 const fmax=fm?FINE.indexOf(fm):0;if(cs.fi>fmax)cs.fi=fmax;
 return `<div class="seg" role="group" aria-label="형의 종류" style="width:max-content;margin-bottom:8px"><button class="tp" data-type="prison" aria-pressed="${cs.type==='prison'}">징역</button><button class="tp" data-type="fine" aria-pressed="${cs.type==='fine'}" ${fm?'':'disabled'}>벌금</button></div>${fm?'':'<p class="hint">이 죄의 법정형에는 벌금이 없습니다.</p>'}
 <div class="sent" id="sentTxt">${sentLine()}</div>
 <div class="mrow"><button data-m="-1" aria-label="한 단계 줄이기">−</button><input type="range" id="sl" min="0" max="${cs.type==='fine'?fmax:LIFE}" value="${cs.type==='fine'?cs.fi:cs.si}" aria-label="형량"><button data-m="1" aria-label="한 단계 늘리기">+</button></div>
 <div class="bar" id="bar">${cs.type==='fine'?fineBar():barSVG()}</div>
 ${guideTable(k)}
 <label class="toggle"><input type="checkbox" id="susp" ${cs.suspend?'checked':''}><span>${cs.type==='fine'?'벌금의 집행을 유예한다 <small style="color:var(--muted)">(500만 원 이하 벌금만, 형법 제62조)</small>':'형의 집행을 유예한다 <small style="color:var(--muted)">(3년 이하 징역만, 형법 제62조)</small>'}</span></label>
 ${verdictBtn()}`}
function sentLine(){const cs=S.cs;if(cs.type==='fine')return `벌금 ${fmtFine(FINE[cs.fi])}${cs.suspend?'<small>집행유예 1년'+(FINE[cs.fi]>500?' · <span style="color:var(--warn)">500만 원을 넘는 벌금에는 붙일 수 없습니다</span>':'')+'</small>':'<small>내지 않으면 노역장 유치</small>'}`;return `${sentText(cs.si)}${cs.suspend?'<small>집행유예 2년</small>':'<small>실형</small>'}`}
function barSVG(){const g=GUIDE[gk()],si=S.cs.si,X=i=>12+i*(276/LIFE);
 let s=`<svg viewBox="0 0 300 84" role="img" aria-label="양형기준 범위와 선택한 형량">`;
 [[4,'4개월'],[12,'1년'],[36,'3년'],[60,'5년'],[120,'10년'],[180,'15년'],[240,'20년'],['life','무기']].forEach(([v,l])=>{const x=X(ix(v));s+=`<line class="grid" x1="${x}" x2="${x}" y1="6" y2="62"/><text class="lbl" x="${x}" y="73" text-anchor="middle">${l}</text>`});
 ['mit','base','agg'].forEach((key,i)=>{const a=ix(g[key][0]),z=ix(g[key][1]),y=10+i*17;s+=`<rect class="band" x="${X(a)-2}" y="${y}" width="${X(z)-X(a)+4}" height="11"/><text class="lbl" x="${Math.min(X(z)+5,270)}" y="${y+9}">${REGION[key].slice(0,2)}</text>`});
 s+=`<line class="mk" x1="${X(si)}" x2="${X(si)}" y1="4" y2="64"/><text class="mkl" x="${Math.min(Math.max(X(si),24),276)}" y="83" text-anchor="middle">${sentText(si).replace('징역 ','')}</text></svg>`;return s}
function fineBar(){const fm=GUIDE[gk()].fineMax,n=FINE.indexOf(fm),fi=S.cs.fi,X=i=>12+i*(276/Math.max(1,n));
 let s=`<svg viewBox="0 0 300 50" role="img" aria-label="벌금 범위와 선택한 금액"><rect class="band" x="10" y="14" width="280" height="10"/>`;
 FINE.slice(0,n+1).forEach((v,i)=>{if(i===0||i===n||v===100||v===500||v===1000||v===3000)s+=`<line class="grid" x1="${X(i)}" x2="${X(i)}" y1="10" y2="28"/><text class="lbl" x="${X(i)}" y="38" text-anchor="middle">${v.toLocaleString('ko-KR')}</text>`});
 s+=`<line class="mk" x1="${X(fi)}" x2="${X(fi)}" y1="6" y2="30"/><text class="mkl" x="${Math.min(Math.max(X(fi),24),276)}" y="49" text-anchor="middle">${fmtFine(FINE[fi])}</text></svg>`;return s}
function updSent(){const cs=S.cs;$('#sentTxt').innerHTML=sentLine();$('#bar').innerHTML=cs.type==='fine'?fineBar():barSVG();const r=$('#sl');if(r)r.value=cs.type==='fine'?cs.fi:cs.si}

function qOpen(q){const cs=S.cs;return !q.req||(cs.asked[q.req]==='done')}
function askQ(q){
 const cs=S.cs,L=TO_LABEL();
 if(!q||cs.asked[q.id]||cs.qLeft<=0||cs.pending||!qOpen(q))return;
 cs.qLeft--;cs.asked[q.id]='wait';sfx('click');
 if(!q.cross){
  const lead=q.conf?`${C().docs.find(d=>d.id===q.conf).no}를 제시하겠습니다. ${L[q.to]}, ${q.q}`:`${L[q.to]}에게 묻겠습니다. ${q.q}`;
  play([['judge',lead,q.conf?'gavel':null],[q.to,q.a]],()=>{cs.asked[q.id]='done';const nw=C().qs.filter(x=>x.req===q.id);addNote('q|'+q.id,(q.conf?'증거 제시 · ':'신문 · ')+L[q.to],q.note);sfx('clue');if(nw.length)toast('추가 신문이 열렸습니다');if(q.conf)jolt(q.to);updAfterQ()});
 }else{
  const byName=q.by==='prosecutor'?'검사':'변호인';
  play([['judge',`${byName}, 신문하십시오.`],[q.by,q.q],[q.obj.by,'이의 있습니다! '+q.obj.text,'objection']],()=>{cs.pending=q.id;renderBench();idle('이의에 대해 결정하십시오.')});
 }
 renderBench();
}
function rule(choice){
 const cs=S.cs,q=C().qs.find(x=>x.id===cs.pending),ok=(choice==='sustain')===q.obj.valid;
 cs.rulings[q.id]={choice,ok};cs.pending=null;
 if(choice==='sustain'){cs.qLeft++;cs.asked[q.id]='done';play([['judge','이의를 인용합니다. 질문을 철회하십시오.','gavel'],[q.by,'철회하겠습니다.']],()=>{toast('철회된 신문은 횟수에서 빼지 않습니다');updAfterQ()})}
 else play([['judge','이의를 기각합니다. 답변하십시오.','gavel'],[q.to,q.a]],()=>{cs.asked[q.id]='done';addNote('q|'+q.id,'신문 · '+TO_LABEL()[q.to],q.note);sfx('clue');updAfterQ()});
 renderBench();
}
function updAfterQ(){renderBench();renderRec();renderHud();idle(S.cs.qLeft>0?`신문을 더 하거나 다음 단계로 넘어가세요. (남은 신문 ${S.cs.qLeft}회)`:'신문 기회를 모두 썼습니다. 증거 채부로 넘어가세요.')}
function flushDialog(){if(!busy||dDone===null&&di>=dq.length)return;clearInterval(typing);typing=null;di=dq.length;show()}

bench.addEventListener('click',e=>{
 const cs=S.cs;if(!cs)return;const t=e.target;
 if(t.closest('[data-nextcase]')){nextCase();return}
 if(busy){if(S.phase!=='trial'||cs.locked)return;flushDialog();if(busy||cs.result)return}
 const st=t.closest('[data-step]');if(st&&!st.disabled){if(cs.pending)return;sfx('click');cs.step=+st.dataset.step;cs.confirm=false;renderBench();return}
 const go=t.closest('[data-go]');if(go){if(cs.pending)return;sfx('click');cs.step=Math.max(0,Math.min(4,cs.step+ +go.dataset.go));cs.confirm=false;renderBench();return}
 const qb=t.closest('[data-q]');if(qb&&!qb.disabled){askQ(C().qs.find(x=>x.id===qb.dataset.q));return}
 const rb=t.closest('[data-rule]');if(rb){rule(rb.dataset.rule);return}
 const ev=t.closest('[data-ev]');if(ev){sfx('click');cs.evid[ev.dataset.ev]=ev.dataset.v;renderBench();if(cs.tab==='docs')renderRec();return}
 const op=t.closest('[data-open]');if(op){sfx('page');cs.tab='docs';cs.doc=op.dataset.open;renderRec();if(typeof MOB==='function'&&MOB()&&typeof setView==='function'){setView('rec');setTimeout(()=>{const pn=document.querySelector('.desk>.panel');if(pn)goTo(pn,false)},0)}else{const pn=document.querySelector('.desk>.panel');if(pn&&pn.getBoundingClientRect().top<0)pn.scrollIntoView({behavior:reduce?'auto':'smooth'})}return}
 const mm=t.closest('[data-m]');if(mm){sfx('click');if(cs.type==='fine'){const n=FINE.indexOf(GUIDE[gk()].fineMax);cs.fi=Math.max(0,Math.min(n,cs.fi+ +mm.dataset.m))}else cs.si=Math.max(0,Math.min(LIFE,cs.si+ +mm.dataset.m));updSent();return}
 const tb=t.closest('[data-type]');if(tb&&!tb.disabled){sfx('click');cs.type=tb.dataset.type;cs.suspend=false;cs.confirm=false;renderBench();return}
 if(t.closest('[data-ask]')){sfx('click');cs.confirm=true;renderBench();return}
 if(t.closest('[data-cancel]')){cs.confirm=false;renderBench();return}
 if(t.closest('[data-pronounce]')){pronounce();return}

 const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
 function init(){if(initP)return initP;initP=(async()=>{

  if(m==='db'){let q=db.collection(col(board,key));if(board==='daily')q=q.where('date','==',key);if(board==='weekly')q=q.where('week','==',key);const snap=await q.orderBy('score','desc').limit(50).get();
   const top=snap.docs.map((d,i)=>Object.assign({},d.data(),{rank:i+1,me:d.id===uid}));let me=top.find(x=>x.me)||null;
   if(!me){const mine=await db.collection(col(board,key)).doc(uid).get();if(mine.exists){const x=mine.data();if((board!=='daily'||x.date===key)&&(board!=='weekly'||x.week===key))me=Object.assign({},x,{rank:null})}}

   const rename=async()=>{if(old&&old.name!==entry.name)await ref.set(Object.assign({},old,{name:entry.name}))};
   if(board==='career'){const score=Math.round(entry.pts*(RANK_DIFF[entry.diff]||1))+entry.rep/1000;if(!old||old.score<score)await ref.set(Object.assign({},entry,{score,date:dayKey()}));else await rename();return {ok:true,improved:!old||old.score<score,score}}
   if(board==='weekly'){const score=entry.score;if(old&&old.week===entry.week&&old.score>=score){await rename();return {ok:true,improved:false}}await ref.set(Object.assign({},entry,{score}));return {ok:true,improved:true}}
   if(board==='quiz'){const score=entry.ok*1000+Math.max(0,600-entry.sec);if(old&&old.score>=score){await rename();return {ok:true,improved:false}}await ref.set(Object.assign({},entry,{score,date:dayKey()}));return {ok:true,improved:true}}

 if(m==='none'){body.innerHTML=`<p>온라인 랭킹에 연결되지 않았습니다. ${window.__STANDALONE__?'랭킹 서버가 있는 주소(예: Vercel 배포판)에서 열면 다른 사람과 순위를 겨룰 수 있습니다.':''} 이 기기의 기록은 <b>내 기록</b> 탭에서 볼 수 있습니다.</p>`;return}

/* ── 모바일 화면 이동: 법정 · 기록 · 판단을 탭으로 나눠 한 번에 하나만 보여 준다 ── */
const MOB=()=>innerWidth<=820||(innerWidth<=1100&&(innerHeight>=innerWidth||innerHeight<=760));
const MNAV={stage:()=>document.querySelector('.stage'),rec:()=>document.querySelector('.desk>.panel'),bench:()=>$('#bench'),top:()=>document.body};
let MV='stage';const MVpos={};
function goTo(el,smooth=true){if(!el)return;const y=el===document.body?0:Math.max(0,el.getBoundingClientRect().top+scrollY-8);scrollTo({top:y,behavior:smooth&&!reduce?'smooth':'auto'})}
function setView(v,opt={}){if(!['stage','rec','bench'].includes(v))return;const same=v===MV;
 if(!same&&MOB()&&document.body.classList.contains('trialm'))MVpos[MV]=scrollY;
 MV=v;['stage','rec','bench'].forEach(k=>document.body.classList.toggle('mv-'+k,k===v));
 const nav=$('#mnav');if(nav){nav.querySelectorAll('[data-go]').forEach(b=>{b.classList.toggle('on',b.dataset.go===v);b.setAttribute('aria-pressed',b.dataset.go===v);if(b.dataset.go===v)b.classList.remove('ping')})}
 if(MOB()&&!same){let y;if(opt.top)y=0;else if(MVpos[v]!=null)y=MVpos[v];else{const el=MNAV[v]();y=el?Math.max(0,el.getBoundingClientRect().top+scrollY-8):0}scrollTo({top:y,behavior:'auto'})}}
function mping(v){if(v===MV||!MOB())return;const b=document.querySelector(`#mnav [data-go="${v}"]`);if(b)b.classList.add('ping')}
let mnavCase=null;
function mnavSync(){const nav=$('#mnav');if(!nav)return;const on=S.phase==='trial'&&!!S.cs;document.body.classList.toggle('trialm',on);nav.hidden=!on;
 if(!on){mnavCase=null;return}
 if(mnavCase!==S.ci){mnavCase=S.ci;Object.keys(MVpos).forEach(k=>delete MVpos[k]);nav.querySelectorAll('.ping').forEach(b=>b.classList.remove('ping'));setView('stage',{top:true});MV='stage'}
 else setView(MV)}
$('#mnav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;sfx('click');
 if(b.dataset.go==='top'){scrollTo({top:0,behavior:reduce?'auto':'smooth'});return}
 if(b.dataset.go===MV){scrollTo({top:0,behavior:reduce?'auto':'smooth'});return}
 setView(b.dataset.go)});
addEventListener('resize',mnavSync);
// 모달·서랍이 열리면 뒤 화면이 따라 움직이지 않게, 새 내용은 맨 위부터
new MutationObserver(ms=>{const open=!modal.hidden||updOpen;document.documentElement.classList.toggle('mlock',open&&MOB());
 if(ms.some(m=>m.type==='childList'||m.attributeName==='hidden')){if(modal._keep){modal._keep=false}else modal.scrollTop=0}}).observe(modal,{childList:true,attributes:true,attributeFilter:['hidden']});
// 대사가 나오는 동안 기록·판단 탭에서는 대사창을 화면 아래에 띄운다 (화면은 그대로)
{let wasTalking=false;new MutationObserver(()=>{const talk=!nextEl.hidden&&S.phase==='trial';document.body.classList.toggle('dlg-on',talk);
  if(wasTalking&&!talk&&S.cs&&!S.cs.result&&MV==='stage')mping('bench');wasTalking=talk}).observe(nextEl,{attributes:true,attributeFilter:['hidden']})}
// 판단 단계를 바꾸면 판단 패널 맨 위로, 선고 결과가 나오면 판단 탭으로 (모바일)
{const _rb=renderBench;let lastStep=null,lastCase=null,lastRes=false;
 renderBench=function(){_rb.apply(this,arguments);if(!S.cs){lastStep=null;lastRes=false;mnavSync();return}
  mnavSync();
  if(MOB())document.querySelectorAll('#bbody>p.hint').forEach(h=>{if(!h.getAttribute('style')&&!h.querySelector('b,strong,span[style],button')&&h.textContent.length>60)h.classList.add('clamp')});
  if(lastCase===S.ci&&lastStep!==S.cs.step&&(!MOB()||MV==='bench')){const b=$('#bench');if(b&&b.getBoundingClientRect().top<0)goTo(b,false)}
  const hasRes=!!S.cs.result;if(MOB()&&hasRes&&!lastRes&&lastCase===S.ci){setView('bench');setTimeout(()=>goTo($('#bench'),false),30)}lastRes=hasRes&&lastCase===S.ci||hasRes;
  lastStep=S.cs.step;lastCase=S.ci}}
$('#bench').addEventListener('click',e=>{const h=e.target.closest('#bbody>p.hint.clamp');if(h)h.classList.toggle('open')});
// 기록을 바꾸면 기록 맨 위가 보이게 (모바일)
rec.addEventListener('click',e=>{if(e.target.closest('[data-doc]')){const p=document.querySelector('.desk>.panel');setTimeout(()=>{if(p.getBoundingClientRect().top<0)goTo(p,false)},0)}});
document.querySelectorAll('.tab[data-tab]').forEach(t=>t.addEventListener('click',()=>{const p=document.querySelector('.desk>.panel');setTimeout(()=>{if(p.getBoundingClientRect().top<0)goTo(p,false)},0)}));
// 안내(튜토리얼)가 가리키는 곳의 탭으로 바꾼다
{const _coach=coach;coach=function(i){const st=COACH[i];if(st&&MOB()&&S.phase==='trial'){const el=document.querySelector(st.sel);if(el){if(el.closest('.stage'))setView('stage');else if(el.closest('#bench'))setView('bench');else if(el.closest('.desk>.panel'))setView('rec')}}return _coach.apply(this,arguments)}}

 {v:'3.1',d:'2026. 10. 21.',t:'새 사건 100건 · 열 가지 새 분야',items:['새 사건 100건이 추가되어 모두 625건이 되었습니다. 형사단독·형사합의부·항소심에 고루 나뉘어 있습니다.','그동안 없던 열 가지 분야의 사건이 생겼습니다. 장물·배임·공갈 같은 재산범, 개인정보와 전자기록, 공무원 범죄와 사법 질서, 기업·금융·세금, 교통과 안전사고, 이웃 분쟁, 노동과 복지, 가족과 돌봄, 환경과 국가유산, 선거·병역·도박 사건입니다.','초보도 풀 수 있는 쉬운 사건부터 항소심의 까다로운 사건까지 난도가 고루 섞였습니다.','새 사건은 이미 진행 중인 오늘의 사건과 주간 챌린지가 바뀌지 않도록, 며칠 뒤부터 오늘의 사건 후보가 되고 주간 챌린지에는 그다음 주부터 나옵니다.']},
 {v:'3.0',d:'2026. 10. 19.',t:'일곱 번째 시나리오 · 표지와 결말 그림',items:['새 시나리오 「다시 여는 문」이 생겼습니다. 고등법원 부장판사가 된 판사가 강요된 자술서, 위헌 결정으로 사라진 조항, 아홉 해 숨어 있던 통장, 선서한 고소인을 차례로 마주하며 확정된 판결을 다시 엽니다. 「법정을 속인 사람들」을 마치면 열립니다.','재심·공소시효·무고와 위증을 다루는 새 사건 4건이 추가되었습니다.','재심 사건에서 재심 전 판결보다 무거운 형을 선고하면, 그 이유가 형사소송법 제439조로 정확히 안내됩니다.','시나리오 「하얀 가루」는 표시된 난이도(어려움)와 달리 표준 규칙으로 진행되고 있었습니다. 이제 표시대로 어려움 규칙으로 진행됩니다.','시나리오 일곱 편을 모두 마치면 받는 업적이 추가되었습니다.','시나리오 일곱 편에 표지 그림이 생겼습니다. 시나리오 목록과 이야기 장면, 결말에서 볼 수 있습니다.','경력 결말마다 그림이 생겼습니다. 징계부터 대법관 후보까지 마지막 보직에 따라 다른 장면이 나옵니다.','새 사건이 추가되는 날에도 그날의 오늘의 사건과 그 주의 주간 챌린지가 바뀌지 않도록, 새 사건은 다음 날(주간 챌린지는 다음 주)부터 후보에 들어갑니다.','「다시 여는 문」 사건들의 법령·판례 설명을 실제 조문과 대법원 판결 번호로 정리했습니다.','웹으로 할 때 첫 화면이 더 빨리 뜹니다. 사건 기록과 그림은 처음 한 번만 내려받고, 다음부터는 브라우저에 저장된 것을 씁니다.']},
 {v:'2.9',d:'2026. 10. 18.',t:'단골 인물 · 돌아온 판결 · 쟁점 수집',items:['새 사건이 추가되어도 오늘의 사건과 주간 챌린지가 바뀌지 않습니다. 같은 날·같은 주에는 누구에게나 같은 사건이 나옵니다.','무죄·공소기각·면소 판결에는 이제 「판결 이유」도 고릅니다. 증명 부족인지, 고소 취소인지, 공소시효인지까지 맞혀야 만점입니다.','경력 첫 몇 사건은 수습 기간이라 중대 오판이 징계 횟수에 들어가지 않습니다. 평판이 바닥나도 한 번은 근신 경고로 끝나고 다시 기회가 주어집니다.','승진 기준과 난이도별 결말 기준을 다듬었습니다. 어려운 난이도일수록 최고 결말을 보기 위한 문턱이 높아집니다.','단골 검사 네 명과 변호인 네 명이 생겼습니다. 사건마다 번갈아 법정에 서고, 처음 만나면 인사를 건넵니다. 기록부에서 이번 경력에 자주 만난 사람을 볼 수 있습니다.','선고 단계에서 「판결문 핵심 이유」를 고를 수 있습니다. 가장 무겁게 본 사정을 제대로 짚으면 평판이 조금 오르고 신문 기사에도 실립니다. 고르지 않아도 됩니다.','고등법원에 오르면 한 번, 내가 1심에서 선고했던 사건이 항소되어 돌아옵니다. 그때의 내 판결을 지금의 내가 다시 심판합니다.','기록부에 「쟁점 수집」이 생겼습니다. 위법수집증거, 전문증거, 함정수사 같은 쟁점별로 판결한 사건을 모으고, 충분히 잘 해내면 「○○ 전문 판사」 칭호를 받습니다.','오늘의 사건 결과를 이모지 칸으로 공유할 수 있습니다. 정답을 밝히지 않고 점수만 보여 줍니다.','위쪽 「글자」 버튼으로 글자 크기를 보통·크게·아주 크게 중에서 고를 수 있습니다.','시나리오에서도 「법정 대화」에 그 장의 이야기 장면이 함께 남아, 재판 중에 다시 읽을 수 있습니다.','범죄경력이 다른 서류와 한데 묶여 있던 사건에도 「범죄경력 조회 회보서」 칸이 따로 생겨, 어느 서류에 있는지 바로 찾아갈 수 있습니다. 모든 모드의 모든 사건에서 범죄경력을 같은 자리에서 확인할 수 있습니다.','오늘의 사건·주간 챌린지 중에 위쪽 「새 게임」으로 처음 화면에 돌아간 뒤 새 경력을 시작하면, 그 경력이 저장되지 않고 판결이 엉뚱한 기록으로 들어가던 오류를 고쳤습니다.','저장 코드로 옮길 때 주간 챌린지 진행, 글자 크기, 순한 사건 모드, 쟁점 칭호도 함께 옮겨집니다.','글자를 키우면 창과 업데이트 내역이 위쪽 메뉴와 어긋나거나 휴대폰 화면 밖으로 밀려나던 문제를 고쳤습니다. 휴대폰에서 글자를 키워도 사건 배당표 카드가 좁아지지 않습니다.','PC 위쪽 머리글을 두 줄로 정리했습니다. 메뉴가 늘어나 판사 이름과 평판 막대가 비좁게 접히던 문제가 사라집니다.','수습 기간이 안내보다 한 건 짧게 끝나던 오류, 고등법원에서 어려운 난이도의 목표 평판이 실제 기준과 다르게 보이던 오류를 고쳤습니다.','죄명을 잘못 고른 판결에서 「판결문 핵심 이유」가 엉뚱하게 채점되던 문제, 판결 형식 자체가 틀렸는데 「이유만 다르다」고 안내되던 문제를 고쳤습니다. 일부 사건의 무죄 이유 정답도 바로잡았습니다.','순한 사건 모드에서 일부 강도 사건과 동물 학대 사건이 걸러지지 않던 문제를 고쳤고, 순한 사건 모드의 기록이 랭킹 재동기화 때 올라가던 문제도 막았습니다. 오늘의 사건 랭킹은 다시 동기화해도 첫 도전 점수만 올라갑니다.','진술서·진술조서 몇 건에 빠져 있던 원진술자 출석 표시를 채웠고, 도움말에 새 기능 설명을 더했습니다.','시나리오 「하얀 가루」는 표시된 난이도(어려움)와 달리 표준 규칙으로 진행되고 있었습니다. 이제 표시대로 어려움 규칙으로 진행됩니다.']},
 {v:'2.8',d:'2026. 10. 16.',t:'시나리오 모드 · 도움말 · 순한 사건 모드',items:['새 콘텐츠 「시나리오」: 기존 사건을 이어 붙인 이야기 여섯 편이 생겼습니다. 「첫 출근」, 「마지막 월급」, 「깡통의 계절」, 「하얀 가루」, 「검은 전화」, 「법정을 속인 사람들」. 장마다 등장인물이 이야기를 이어 가고, 판결에 따라 반응과 결말이 달라집니다.','시나리오는 차례로 열립니다. 한 편을 끝까지 마치면 다음 이야기가 열리고, 다섯 편을 모두 마치면 마지막 이야기가 열립니다.','시나리오에서 중대한 오판을 하거나 기준에 못 미치는 점수를 받으면 경고와 함께 그 장의 점수가 깎입니다. 경고가 한도에 이르면 사건이 다른 재판부로 넘어가 처음부터 다시 해야 합니다.','시나리오는 중간에 나가도 이어서 할 수 있고, 진행 상황은 저장 코드에도 함께 담깁니다. 경력과 평판에는 영향을 주지 않습니다.','새 사건이 추가되었습니다. 부풀린 고소, 운전자 바꿔치기, 증거인멸 지시, 증언거부권을 듣지 못한 증인, 판사와의 친분을 판 브로커 사건입니다.','개정 때 오간 진술과 신문 답변이 사건기록의 「법정 대화」에 남습니다. 지나간 말을 언제든 다시 읽을 수 있습니다.','도움말이 생겼습니다. 재판 진행 순서, 판결 점수, 평판이 오르내리는 기준, 각 모드를 설명합니다. 특히 소송지휘(이의 결정)는 판결 점수와 따로 평판에 바로 반영되니 신중하게 결정하세요.','소송지휘가 평판에 주는 영향을 조정했고, 결과 화면에서도 이 점을 안내합니다.','「순한 사건 모드」가 생겼습니다. 아이와 함께할 때 켜 두면 살인·강도·방화·마약·흉기 사건 등이 나오지 않습니다. 처음 화면 아래, 새 경력 설정, 도움말에서 켜고 끌 수 있습니다.','처음 화면을 정리했습니다. 경력 버튼은 위에, 시나리오·오늘의 사건·주간 챌린지·증거 퀴즈는 같은 모양의 칸으로, 랭킹·도움말 등은 아래 링크로 모았습니다.','사건 배당표에서 이미 판결한 사건에는 표시와 그 사건의 최고 점수가 붙습니다.','PC에서는 기록철과 판단 절차 안의 스크롤을 없애고 페이지 스크롤 하나로 정리했습니다. 두 패널의 높이가 맞춰지고, 어디서 휠을 돌려도 페이지가 움직입니다.','휴대폰에서 증거 채부의 「기록 열람」을 누르면 기록 화면으로 바로 넘어갑니다.','시나리오 업적이 추가되었습니다.','모든 사건에서 피고인의 범죄경력 조회 회보서를 볼 수 있습니다. 조회서가 따로 없던 사건에는 참고 기록으로 붙었습니다.','진술서·진술조서에는 그 진술을 한 사람이 법정에 나와 증언했는지가 표시됩니다.','주간 챌린지를 중간에 그만두어도 이어서 할 수 있습니다. 다시 누르면 이어하기와 처음부터 중 고를 수 있습니다.','폴더블 휴대폰과 태블릿 화면을 손봤습니다. 펼친 화면이나 세로로 긴 태블릿에서도 법정·기록·판단 화면이 나뉘어 보여, 접었다 펴지 않아도 편하게 할 수 있습니다.','PC 처음 화면에서 메뉴가 늘어나며 생기던 안쪽 스크롤을 없앴습니다. 화면 높이가 낮아도 모든 메뉴가 한 번에 보입니다.']},
 {v:'2.7',d:'2026. 10. 16.',t:'랭킹 · 주간 챌린지 · 증거 퀴즈',items:['랭킹이 생겼습니다. 처음 화면과 위쪽의 랭킹 버튼에서 경력·오늘의 사건·주간 챌린지·증거 퀴즈 순위와 내 기록을 볼 수 있습니다. 경력은 징계 없이 끝까지 마치면 경력 길이별로 등록되고, 오늘의 사건은 그날 첫 도전만 올라갑니다.','새 콘텐츠 「주간 챌린지」: 매주 월요일 중대 사건 3건이 정해집니다. 모두 같은 사건을 어려움 난이도로 이어서 심리하고 합계 점수로 겨룹니다. 경력과 평판에는 영향이 없습니다.','새 콘텐츠 「증거 퀴즈」: 여러 사건에서 뽑은 증거와 상대방 의견을 보고 채택할지 배제할지 연달아 고르는 짧은 연습입니다. 답을 고르면 바로 이유가 나옵니다.','온라인 랭킹 서버가 있는 배포판을 따로 준비했습니다. 연결되지 않은 곳에서는 이 기기 기록만 보입니다.','새 업적이 추가되었습니다.','휴대폰 화면을 법정 · 기록 · 판단 세 화면으로 나눴습니다. 아래 버튼으로 바꾸면 화면이 위아래로 튀지 않고 바로 넘어가며, 각 화면에서 보던 위치가 그대로 남습니다. 신문 답변 같은 대사는 지금 보는 화면 아래에 떠서 화면을 옮길 필요가 없습니다. 새로 볼 것이 생긴 화면에는 점이 표시됩니다.','휴대폰 판단 화면을 줄였습니다. 단계 막대는 위에, 이전·다음 버튼은 아래에 붙어 있어 끝까지 내리지 않아도 넘어갈 수 있고, 증거 채부는 한 증거가 한눈에 들어오게 정리했습니다. 긴 설명은 두 줄만 보이고 누르면 펼쳐집니다.','저장 코드와 주소 이전에 랭킹 기록이 함께 담깁니다. 불러오면 같은 사람으로 이어지고, 이 기기의 최고 기록이 랭킹에 반영됩니다. 이름을 바꾸면 랭킹의 이름도 바뀝니다.','처음 화면에서 판사 이름을 바로 정하고 언제든 바꿀 수 있습니다. 경력·오늘의 사건·주간 챌린지·증거 퀴즈와 랭킹에 같은 이름이 쓰입니다.']},
 {v:'2.6',d:'2026. 10. 15.',t:'증거 인부 · 재범 위험성 · 중형 사건',items:['증거 채부 단계에서 증거마다 상대방 의견(인부)이 보입니다. 검사가 낸 증거에는 피고인·변호인 의견(동의, 부동의, 내용 부인, 위법수집 주장, 임의성 다툼, 증명력 다툼 등)이, 피고인 측이 낸 증거에는 검사 의견이 붙습니다. 기록 열람 화면, 선고 결과, 판례집에도 표시됩니다.','인부와 증거능력은 다릅니다. 상대방이 다투지만 실제로는 증거능력이 있는 함정 증거를 크게 늘렸습니다. 공문서·업무 문서(제315조), 임의제출 영상, 영장으로 받은 자료, 대화 당사자의 녹음 등이 대표적입니다. 틀리면 결과 화면에 "인부 판단" 이유가 나옵니다.','새 양형 인자: 재범 위험성 높음(일반가중), 재범 위험성 낮음(일반감경). 여러 사건에 기록 근거와 함께 정답 인자로 들어갔고, 누범·전과를 두 번 세는 함정도 있습니다.','무거운 형이 정답인 중대 사건을 늘렸습니다. 합의부(보험금 살인, 강도살인, 연쇄 방화치사, 보복살인 등)와 항소심에 새 사건이 들어왔습니다.','법원별 형 쏠림을 완화했습니다. 항소심·합의부에서 벌금도 정답으로 인정되는 사건이 늘었고, 단독 벌금 사건 일부는 징역 집행유예도 정답으로 인정합니다.','대법정 난이도에서는 인부 의견 문구 없이 결과만 보입니다.','증거 채부가 어려워진 만큼 인사 기준과 평판 상승을 조금 완화했습니다.','증거 설명이 법리상 부족했던 곳과 새 사건 검수에서 찾은 오류를 바로잡았습니다.']},
 {v:'2.5',d:'2026. 10. 15.',t:'모바일 화면 이동',items:['휴대폰에서 재판 중 화면 아래에 이동 버튼(법정 · 기록 · 판단 · 위로)이 생겼습니다. 누르면 그 위치로 바로 이동하고, 지금 보고 있는 곳이 표시됩니다.','신문하면 대사창으로 자동 이동하고, 대사가 끝나면 보던 판단 화면으로 돌아옵니다. 이의 결정이나 선고 결과도 바로 보이는 곳으로 이동합니다.','판단 단계를 바꾸면 판단 절차 맨 위로 이동합니다.','창(배당표·판례집·설정 등)을 열면 뒤 화면이 따라 움직이지 않고, 새 창은 항상 맨 위부터 보입니다.','휴대폰에서 위쪽 메뉴·평판 정보·사건 정보를 한 줄로 줄여 화면을 넓게 쓰도록 했습니다. 옆으로 밀면 나머지가 보입니다.']},
 {v:'2.4',d:'2026. 10. 15.',t:'사건 대폭 확장 · 새 경력 설정',items:['사건을 크게 늘렸습니다. 새 사건은 생활 범죄·교통·온라인·노동·식품의료·강도·살인·방화·경제·마약·보이스피싱·뇌물·산재·증거법·항소심 쟁점별로 나눠 썼고, 복합 범죄 사건도 늘었습니다.','난이도를 수습 · 표준 · 원로 · 대법정으로 바꿨습니다. 어려울수록 신문 기회가 줄고 감점이 커지며 어려운 사건이 배당되는 대신 평판이 더 오릅니다.','경력 길이를 단기 · 표준 · 장기 · 대장정 가운데 고를 수 있습니다.','사건 배당 방식을 고를 수 있습니다: 점점 어렵게(기본) 또는 무작위. 어느 쪽이든 이전 경력에서 보지 않은 사건을 먼저 배당합니다.','새 경력 화면을 별도 설정 창(선택 카드)으로 바꿨습니다.','배당표에서 한 번 "다른 사건 받기"로 세 사건을 새로 받을 수 있습니다.','업데이트 내역이 옆에서 열리는 창으로 바뀌었습니다. 업데이트 버튼을 다시 누르거나, Esc, 바깥 누르기, ✕, 아래로 끌어내리기로 닫힙니다. 재판 중에도 화면을 잃지 않고 열어 볼 수 있습니다.','나의 판례집: 검색, 난도 구간 필터, 열람한 사건만 보기, 더 보기를 추가했습니다.','막간 이벤트와 업적을 더 추가했습니다.','난이도 분포는 그대로 유지했습니다. 각 사건의 법리·사실관계를 다시 검수해 바로잡았습니다.']},
 {v:'2.3',d:'2026. 10. 15.',t:'입문 사건 · 난이도 재조정',items:['입문·쉬움 사건을 새로 넣었습니다. 형사단독의 입문 사건과 합의부·항소심의 쉬운 사건입니다.','전체 사건 난이도를 다시 매겨 쉬운 사건이 크게 늘었습니다.','배당표가 보직 안에서 점점 어려워집니다. 첫 사건은 쉬운 사건, 보직 끝 무렵에는 그 재판부의 어려운 사건이 나옵니다.','어려운 사건일수록 평판이 더 오르도록 가중치를 조정했습니다.','인사 기준과 중대 오판 한도를 완화했습니다.','배당표 사건이 난이도 순으로 정렬됩니다.']},
 {v:'2.2',d:'2026. 10. 15.',t:'복합 범죄 · 오늘의 사건',items:['노동·온라인·교통·강력·경제·증거법·항소심 사건과 복합·중대 범죄 사건이 새로 들어왔습니다.','복합 범죄 사건: 공소사실마다 유죄·무죄·공소기각을 따로 판단하고, 둘 이상 유죄면 경합범으로 한 번에 형을 정합니다. 일부만 맞히면 부분 점수를 받습니다.','난이도를 더 세분화했습니다.','오늘의 사건: 날마다 바뀌는 사건 하나에 도전하는 모드. 경력과 별개로 기록되고 연속 도전 일수가 쌓입니다.','나의 판례집: 판결한 사건의 정답, 이유, 판례, 증거 판단을 다시 읽을 수 있습니다.','막간 이벤트와 업적을 추가했습니다.']},
 {v:'2.1',d:'2026. 10. 15.',t:'벌금 집행유예',items:['500만 원 이하 벌금형에도 집행유예를 붙일 수 있습니다 (형법 제62조).','500만 원을 넘는 벌금이나 누범 기간 사건에 집행유예를 붙이면 법령 위반으로 파기됩니다.','새 규칙에 맞춰 형량 정답을 다시 검토했습니다. 징역과 벌금이 모두 적정한 사건은 둘 다 정답으로 인정합니다.','가상 플레이로 경력을 끝까지 돌려 평판을 다시 맞췄습니다. 평판이 더 잘 오르고, 파기와 중대 오판 감점을 줄였습니다.','중대 오판은 이제 보직마다 따로 셉니다. 한 보직에서 정해진 횟수가 쌓이면 징계이고, 승진하면 다시 처음부터 셉니다. 쉬움 난이도는 조금 더 허용합니다.']},
 {v:'2.0',d:'2026. 10. 15.',t:'평판 리밸런싱',items:['평판이 훨씬 잘 오르도록 계산을 바꿨습니다.','상급심 파기 감점과 중대 오판 감점을 줄였습니다.','중대 오판 허용 횟수를 경력 길이에 맞췄습니다.','인사 기준을 다시 맞췄습니다.']},
 {v:'1.9',d:'2026. 10. 15.',t:'승진 완화',items:['인사 평가 기준을 낮췄습니다.','상급심 파기와 낮은 점수의 평판 감점을 줄였습니다. 사건이 많은 경력일수록 더 줄어듭니다.','배경음악 기본 음량을 키웠습니다.','상단에 업데이트 내역 버튼을 추가했습니다.']},

/* ── 저장 코드: 이 브라우저의 저장 데이터를 글자 한 줄로 바꿔 다른 기기로 옮긴다 ── */
const SAVE_KEYS=['verdict-save2','verdict-ach','verdict-seen','verdict-best','verdict-audio','verdict-daily','verdict-bestcase','verdict-gstats','verdict-pid','verdict-name','verdict-myrank','verdict-weekly','verdict-quiz','verdict-story','verdict-wkprog','verdict-issuet','verdict-zoom','verdict-mild','verdict-dfirst'];
function b64u(bytes){let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const bin=atob(t),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function fnv(t){let h=0x811c9dc5;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36).padStart(7,'0')}
async function pipe(bytes,stream){const r=new Blob([bytes]).stream().pipeThrough(stream);return new Uint8Array(await new Response(r).arrayBuffer())}
async function makeCode(){
 if(S.phase==='trial'||S.phase==='docket')save();
 const data={g:'verdict',v:1,at:Date.now()};SAVE_KEYS.forEach(k=>{const v=store.get(k);if(v!=null)data[k]=v});
 let bytes=new TextEncoder().encode(JSON.stringify(data)),ver='0';
 if(typeof CompressionStream!=='undefined'){try{bytes=await pipe(bytes,new CompressionStream('deflate-raw'));ver='1'}catch(e){bytes=new TextEncoder().encode(JSON.stringify(data));ver='0'}}
 const body=b64u(bytes);return {code:`PGM${ver}.${body}.${fnv(body)}`,data};
}
function scrub(v){if(typeof v==='string')return v.replace(/[<>]/g,'');if(Array.isArray(v))return v.map(scrub);if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=scrub(v[k]);return o}return v}
async function readCode(raw){
 const t=(raw||'').replace(/\s+/g,'');const m=t.match(/PGM([01])\.([A-Za-z0-9_-]+)\.([0-9a-z]{7})/);
 if(!m)throw new Error('저장 코드 형식이 아닙니다. "PGM"으로 시작하는 코드를 통째로 붙여 넣어 주세요.');
 if(fnv(m[2])!==m[3])throw new Error('코드 일부가 빠졌거나 바뀌었습니다. 처음부터 끝까지 빠짐없이 복사했는지 확인해 주세요.');
 let bytes=unb64u(m[2]);
 if(m[1]==='1'){if(typeof DecompressionStream==='undefined')throw new Error('이 브라우저는 압축된 저장 코드를 풀 수 없습니다. 브라우저를 최신 버전으로 업데이트해 주세요.');bytes=await pipe(bytes,new DecompressionStream('deflate-raw'))}
 let data;try{data=JSON.parse(new TextDecoder().decode(bytes))}catch(e){throw new Error('저장 코드를 읽지 못했습니다.')}
 if(!data||data.g!=='verdict')throw new Error('「판결의 무게」 저장 코드가 아닙니다.');
 return scrub(data);
}

 <div class="cf"><button class="btn" id="mrno">불러오지 않기</button><button class="btn primary" id="mrok">불러오기</button></div></div>`;
 modal.querySelector('#mrok').focus();
 modal.querySelector('#mrno').onclick=()=>{sfx('click');modal.hidden=true};
 modal.querySelector('#mrok').onclick=()=>{sfx('gavel');const nm=data['verdict-save2']&&data['verdict-save2'].name;applyImport(data);if(nm&&!store.get('verdict-name'))store.set('verdict-name',String(nm).replace(/[<>"'&]/g,'').slice(0,6));if(S.phase==='title')titleScreen()};
 return true}
async function moveBoot(){if(await moveReceive())return;if(!isOldHost())return;moveBanner();let later=false;try{later=sessionStorage.getItem('verdict-move-later')==='1'}catch(e){}if(!later&&modal.hidden)moveModal()}
function saveManager(focus){
 const inGame=S.phase==='trial'||S.phase==='docket';
 if(inGame)save();
 const back=()=>{modal.hidden=true;if(S.phase==='docket')docket()};
 const hasData=SAVE_KEYS.some(k=>store.get(k)!=null);
 modal.hidden=false;modal.innerHTML=`<div class="card wide svm" role="dialog" aria-modal="true" aria-label="저장 관리"><div class="ch"><h3>저장 관리</h3><span>${inGame?'이 브라우저에 방금 저장했습니다':'진행은 자동으로 저장됩니다'}</span></div><div class="cb">
 <div class="sect">다른 기기로 옮기기</div>
 <p class="note" style="margin-top:0">저장 코드를 만들어 다른 브라우저나 휴대폰에서 붙여 넣으면 이어서 할 수 있습니다. 메신저로 자기 자신에게 보내 두면 편합니다.</p>
 <div class="row2"><button class="btn primary" id="mkcode" ${hasData?'':'disabled'}>저장 코드 만들기</button>${window.__STANDALONE__?`<button class="btn" id="dlfile" ${hasData?'':'disabled'}>파일로 내려받기</button>`:''}</div>
 <div id="codebox" hidden><textarea id="codeout" readonly aria-label="저장 코드"></textarea><div class="row2"><button class="btn" id="cpcode">코드 복사</button><span class="note" id="cpmsg"></span></div></div>
 ${hasData?'':'<p class="note">아직 이 브라우저에 저장된 진행이 없습니다.</p>'}
 <div class="sect">다른 기기의 진행 불러오기</div>
 <textarea id="codein" placeholder="여기에 저장 코드를 붙여 넣으세요 (PGM으로 시작)" aria-label="불러올 저장 코드"></textarea>
 <div class="row2"><button class="btn primary" id="rdcode">코드로 불러오기</button><label class="btn filebtn">저장 파일 열기<input type="file" id="rdfile" accept=".txt,text/plain"></label></div>
 <div id="imsg"></div>
 </div><div class="cf"><span class="note" style="margin:0">불러오면 이 기기의 진행을 덮어씁니다. 업적과 사건 도감은 합쳐집니다.</span><button class="btn" id="svclose">닫기</button></div></div>`;
 const $m=q=>modal.querySelector(q);
 $m('#svclose').onclick=()=>{sfx('click');back()};
 let made=null;
 const ensure=async()=>{if(!made)made=await makeCode();return made};
 $m('#mkcode').onclick=async()=>{sfx('click');try{const {code}=await ensure();$m('#codebox').hidden=false;$m('#codeout').value=code;$m('#codeout').focus();$m('#codeout').select();$m('#cpmsg').textContent=`${code.length.toLocaleString('ko-KR')}자 · 코드 전체를 복사하세요`}catch(e){$m('#cpmsg').textContent='코드를 만들지 못했습니다.'}};
 $m('#cpcode').onclick=()=>{const ta=$m('#codeout');const v=ta.value;const ok=()=>{$m('#cpmsg').textContent='복사했습니다. 다른 기기의 저장 관리에 붙여 넣으세요.';sfx('stamp')};const fail=()=>{ta.focus();ta.select();$m('#cpmsg').textContent='자동 복사가 막혀 있습니다. 선택된 코드를 직접 복사해 주세요.'};
  try{navigator.clipboard.writeText(v).then(ok,fail)}catch(e){fail()}};
 if($m('#dlfile'))$m('#dlfile').onclick=async()=>{sfx('click');try{const {code,data}=await ensure();const sv=data['verdict-save2'];const d=new Date();const name=`판결의무게_저장_${(sv&&sv.name)||'판사'}_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.txt`;
  const url=URL.createObjectURL(new Blob([`「판결의 무게」 저장 파일\n다른 기기의 저장 관리에서 '저장 파일 열기'로 불러오거나, 아래 코드를 붙여 넣으세요.\n\n${code}\n`],{type:'text/plain'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  $m('#codebox').hidden=false;$m('#codeout').value=code;$m('#cpmsg').textContent='파일이 내려받아지지 않으면 이 코드를 복사해 쓰세요.'}catch(e){toast('파일을 만들지 못했습니다')}};
 const preview=async raw=>{const box=$m('#imsg');box.innerHTML='';try{const data=await readCode(raw);sfx('page');
   box.innerHTML=`<div class="pv">${summary(data)}</div><div class="row2"><button class="btn danger" id="imok">이 진행으로 불러오기</button><button class="btn" id="imno">취소</button></div>`;
   $m('#imok').focus();$m('#imok').onclick=()=>{sfx('gavel');applyImport(data)};$m('#imno').onclick=()=>{sfx('click');box.innerHTML=''}}
  catch(e){sfx('bad');box.innerHTML=`<p class="err">${e.message}</p>`}};
 $m('#rdcode').onclick=()=>preview($m('#codein').value);
 $m('#rdfile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$m('#codein').value='';preview(String(r.result))};r.onerror=()=>{$m('#imsg').innerHTML='<p class="err">파일을 읽지 못했습니다.</p>'};r.readAsText(f);e.target.value=''};
 (focus==='import'?$m('#codein'):$m('#mkcode').disabled?$m('#codein'):$m('#mkcode')).focus();
}
$('#newBtn').onclick=()=>{audioInit();if(lockModal)return;if(S.cs&&S.cs.locked&&!S.cs.result){toast('선고 중입니다');return}sfx('click');updClose();if(coachEl)coachEnd();const wasUpd=!modal.hidden&&!!modal.querySelector('#updok'),wasLog=!!modal.querySelector('#logok')&&!modal.hidden,wasSave=!modal.hidden&&!!modal.querySelector('.svm');
 if(S.phase==='load'||S.phase==='title'){titleScreen();return}
 lockModal=true;const prev=modal.innerHTML,wasHidden=modal.hidden;
 modal.hidden=false;modal.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-label="새 게임"><div class="ch"><h3>새 게임</h3></div><div class="cb"><p>지금 경력을 끝내고 처음 화면으로 돌아갈까요?</p><p style="color:var(--muted);font-size:13.5px">${S.phase==='end'?'':'지금까지의 진행은 저장되어 있어, 처음 화면에서 이어하기를 고를 수 있습니다. 새 경력을 시작해야 지워집니다.'}</p></div><div class="cf"><button class="btn" id="nno">계속 하기</button><button class="btn primary" id="nyes">처음 화면으로</button></div></div>`;
 $('#nno').focus();
 $('#nno').onclick=()=>{sfx('click');lockModal=false;if(wasUpd)showUpdates();else if(wasSave)saveManager();else if(wasLog)showLog();else if(S.phase==='docket')docket();else{modal.innerHTML=prev;modal.hidden=wasHidden}};
 $('#nyes').onclick=()=>{sfx('click');lockModal=false;if(S.phase!=='end')save();if(coachEl)coachEnd();clearInterval(typing);busy=false;modal.hidden=true;titleScreen()}};
$('#zoomBtn').onclick=()=>{audioInit();sfx('click');cycleZoom()};applyZoom();
$('#helpBtn').onclick=()=>{audioInit();if(lockModal)return;sfx('page');updClose();showHelp()};
$('#logBtn').onclick=()=>{audioInit();if(lockModal)return;sfx('click');if(coachEl)coachEnd();showLog()};
setAudioUI();

/* ═════════ 로딩 화면 ═════════ */
(function loader(){
 const L=$('#loader'),lc=$('#ldc'),lx=lc.getContext('2d'),fill=$('#lfill'),msg=$('#lmsg');lx.imageSmoothingEnabled=false;
 const MSGS=['법전을 펼치는 중…','양형기준표를 정리하는 중…','증거물을 봉인하는 중…','방청석을 채우는 중…','법복을 다리는 중…'];
 let p=0,ready=false,t0=performance.now(),raf;
 const fontsOk=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();let fontsDone=false;fontsOk.then(()=>fontsDone=true);setTimeout(()=>fontsDone=true,3500);
 function frame(t){
  lx.clearRect(0,0,48,32);
  lx.fillStyle='#3b271a';lx.fillRect(4,24,40,6);lx.fillStyle='#7a5538';lx.fillRect(4,24,40,1);
  lx.fillStyle='#20160f';lx.fillRect(26,21,12,3);
  const ph=(t/700)%1,up=ph<.7?Math.sin(ph/.7*Math.PI/2)*8:8*(1-(ph-.7)/.3*1);
  lx.drawImage(sprite('gav',GAVEL,{k:'#4a2c18',l:'#c9a24b',n:'#7a4f2c'}),22,14-Math.round(reduce?0:up));
  lx.drawImage(sprite('emb',EMBLEM,{y:'#c9a24b'}),4,4);
  const el=t-t0;const target=Math.min(fontsDone?100:85,el/14);p+=(target-p)*.12;fill.style.width=p.toFixed(1)+'%';msg.textContent=p>98?'준비가 끝났습니다.':MSGS[Math.min(MSGS.length-1,Math.floor(p/20))];
  if(!ready&&p>98&&el>1300){ready=true;L.classList.add('ready');$('#ltap').hidden=false}
  raf=requestAnimationFrame(frame)}
 raf=requestAnimationFrame(frame);
 const go=()=>{if(!ready)return;cancelAnimationFrame(raf);audioInit();if(AU.bgmOn)bgmStart();sfx('gavel');L.hidden=true;titleScreen();setTimeout(moveBoot,350)};
 L.addEventListener('click',go);document.addEventListener('keydown',e=>{if(!L.hidden&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go()}});
})();
renderHud();renderRec();renderBench();
</script>
